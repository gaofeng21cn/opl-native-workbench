name: OPL Studio Non-Release Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-studio-non-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-distribution:
    name: ${{ matrix.label }} package and installer lifecycle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            distribution: windows
            builder_target: win
          - label: Linux x64
            os: ubuntu-latest
            distribution: linux
            builder_target: linux
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product
      OPL_DESKTOP_WINDOWS_INSTALL_ID: a1f6388a-3f9a-5543-b06c-e3debfa55a91

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the admitted App product-profile cohort
        id: app-cohort
        shell: bash
        run: |
          node -e 'const fs=require("fs");const evidence=JSON.parse(fs.readFileSync("src/candidateContractEvidence.json","utf8"));const sha=evidence.candidate_runtime_qualification?.external_cohort?.app_commit;if(!/^[0-9a-f]{40}$/.test(sha??""))throw new Error("missing exact App cohort commit");process.stdout.write("sha="+sha+"\n")' >> "$GITHUB_OUTPUT"

      - name: Checkout App product authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.app-cohort.outputs.sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Run desktop source gates
        run: npm run typecheck && npm run test:desktop

      - name: Prepare lifecycle versions and persistent smoke state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) throw new Error(`desktop lifecycle requires numeric semver, observed ${pkg.version}`);
          const targetVersion = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          const stateRoot = fs.mkdtempSync(path.join(os.tmpdir(), "opl-desktop-package-lifecycle-"));
          const marker = path.join(stateRoot, "existing-user-state.txt");
          fs.writeFileSync(marker, `preserve-${process.env.GITHUB_SHA}\n`, "utf8");
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `OPL_DESKTOP_BASE_VERSION=${pkg.version}`,
            `OPL_DESKTOP_TARGET_VERSION=${targetVersion}`,
            `OPL_DESKTOP_SMOKE_STATE_ROOT=${stateRoot}`,
            `OPL_DESKTOP_STATE_MARKER=${marker}`,
            ""
          ].join("\n"));
          NODE

      - name: Build unsigned base ${{ matrix.label }} distribution
        run: npm run dist:${{ matrix.distribution }}

      - name: Build unsigned target ${{ matrix.label }} distribution
        shell: bash
        run: |
          npx electron-builder \
            --${{ matrix.builder_target }} \
            --config electron-builder.yml \
            --publish never \
            --config.directories.output=out-target \
            --config.extraMetadata.version="$OPL_DESKTOP_TARGET_VERSION"

      - name: Validate base and target native package sets
        shell: bash
        run: |
          npm run qualify:desktop:distribution
          node scripts/validate-desktop-package.mjs \
            --distribution \
            --out-root out-target \
            --version "$OPL_DESKTOP_TARGET_VERSION"

      - name: Prepare Chromium sandbox for unpacked Linux runtime
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          sudo chown root:root out/linux-unpacked/chrome-sandbox
          sudo chmod 4755 out/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' out/linux-unpacked/chrome-sandbox)" = "root:root 4755"

      - name: Start unpacked app and read Chromium AX tree
        shell: bash
        run: |
          if test "${{ matrix.distribution }}" = linux; then
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
              xvfb-run --auto-servernum npm run smoke:desktop-live
          else
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
              npm run smoke:desktop-live
          fi

      - name: Install base Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }

          $installRegistryPath = "HKCU:\Software\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $programsRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $fallbackInstallRoot = Join-Path $programsRoot 'opl-studio'
          if ((Test-Path -LiteralPath $installRegistryPath) -or
              (Test-Path -LiteralPath $uninstallRegistryPath) -or
              (Test-Path -LiteralPath $fallbackInstallRoot)) {
            throw "clean runner already contains the exact One Person Lab Preview install identity"
          }

          "OPL_DESKTOP_WINDOWS_INSTALL_ATTEMPTED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $installerProcess = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($installerProcess.ExitCode)"
          }

          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path -LiteralPath $installRegistryPath) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $installRegistryPath)) {
            throw "NSIS install did not create its exact HKCU install identity"
          }

          $installRoot = [IO.Path]::GetFullPath((Get-ItemProperty -LiteralPath $installRegistryPath).InstallLocation)
          $programsPrefix = [IO.Path]::GetFullPath($programsRoot).TrimEnd('\') + '\'
          if (-not $installRoot.StartsWith($programsPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "NSIS InstallLocation escaped the current-user Programs root: $installRoot"
          }
          $installedExecutable = Join-Path $installRoot 'One Person Lab Preview.exe'
          $uninstaller = Join-Path $installRoot 'Uninstall One Person Lab Preview.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "NSIS InstallLocation is missing the application executable: $installedExecutable"
          }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "NSIS InstallLocation is missing the uninstaller: $uninstaller"
          }
          if (-not (Test-Path -LiteralPath $uninstallRegistryPath)) {
            throw "NSIS install did not register its exact uninstall identity"
          }
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_BASE_VERSION) {
            throw "NSIS base install reported version $installedVersion instead of $env:OPL_DESKTOP_BASE_VERSION"
          }

          "OPL_DESKTOP_EXECUTABLE=$installedExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPL_DESKTOP_APP_PATH=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start base Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_BASE_VERSION
          npm run smoke:desktop-live

      - name: Update Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out-target -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one target NSIS installer, found $($installers.Count)"
          }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS update exited with code $($process.ExitCode)"
          }
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_TARGET_VERSION) {
            throw "NSIS update reported version $installedVersion instead of $env:OPL_DESKTOP_TARGET_VERSION"
          }
          if ((Get-Content -LiteralPath $env:OPL_DESKTOP_STATE_MARKER -Raw).Trim() -ne "preserve-$env:GITHUB_SHA") {
            throw "NSIS update did not preserve the existing user-state marker"
          }

      - name: Start updated Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_TARGET_VERSION
          npm run smoke:desktop-live

      - name: Roll back Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one base NSIS installer, found $($installers.Count)"
          }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS rollback exited with code $($process.ExitCode)"
          }
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_BASE_VERSION) {
            throw "NSIS rollback reported version $installedVersion instead of $env:OPL_DESKTOP_BASE_VERSION"
          }
          if ((Get-Content -LiteralPath $env:OPL_DESKTOP_STATE_MARKER -Raw).Trim() -ne "preserve-$env:GITHUB_SHA") {
            throw "NSIS rollback did not preserve the existing user-state marker"
          }

      - name: Start rolled-back Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_BASE_VERSION
          npm run smoke:desktop-live

      - name: Uninstall Windows NSIS package and verify cleanup
        if: ${{ always() && matrix.distribution == 'windows' }}
        shell: pwsh
        run: |
          if ($env:OPL_DESKTOP_WINDOWS_INSTALL_ATTEMPTED -ne '1') {
            Write-Host 'No NSIS install was attempted by this job; leaving pre-existing state untouched.'
            exit 0
          }

          $installRegistryPath = "HKCU:\Software\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $fallbackInstallRoot = Join-Path (Join-Path $env:LOCALAPPDATA 'Programs') 'opl-studio'
          $installRoot = if (Test-Path -LiteralPath $installRegistryPath) {
            [string](Get-ItemProperty -LiteralPath $installRegistryPath).InstallLocation
          } elseif ($env:OPL_DESKTOP_APP_PATH) {
            $env:OPL_DESKTOP_APP_PATH
          } else {
            $fallbackInstallRoot
          }

          $uninstaller = Join-Path $installRoot 'Uninstall One Person Lab Preview.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) {
              throw "NSIS uninstaller exited with code $($uninstallProcess.ExitCode)"
            }
          } elseif ((Test-Path -LiteralPath $installRoot) -or (Test-Path -LiteralPath $installRegistryPath)) {
            throw "NSIS install attempt left product state without its exact uninstaller"
          }

          $deadline = (Get-Date).AddSeconds(30)
          while (((Test-Path -LiteralPath $installRoot) -or
                  (Test-Path -LiteralPath $installRegistryPath) -or
                  (Test-Path -LiteralPath $uninstallRegistryPath)) -and
                 (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path -LiteralPath $installRoot) -or
              (Test-Path -LiteralPath $installRegistryPath) -or
              (Test-Path -LiteralPath $uninstallRegistryPath)) {
            throw "NSIS uninstall left exact product files or registry identity behind"
          }

      - name: Install base Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out/*.deb)
          test "${#debs[@]}" -eq 1
          package_name="$(dpkg-deb -f "${debs[0]}" Package)"
          test -n "$package_name"
          echo "OPL_DESKTOP_DEB_PACKAGE=$package_name" >> "$GITHUB_ENV"

          deb_path="$(realpath "${debs[0]}")"
          sudo apt-get install --no-install-recommends --yes "$deb_path"
          test "$(dpkg-query -W -f='${Version}' "$package_name")" = "$OPL_DESKTOP_BASE_VERSION"
          executable="$(command -v one-person-lab-preview)"
          test -n "$executable"
          real_executable="$(readlink -f "$executable")"
          app_path="$(dirname "$real_executable")"
          test -x "$real_executable"
          if sudo bash -c '[[ -L /proc/self/ns/user ]] && unshare --user true'; then
            expected_sandbox_state='root:root 755'
          else
            expected_sandbox_state='root:root 4755'
          fi
          test "$(stat -c '%U:%G %a' "$app_path/chrome-sandbox")" = "$expected_sandbox_state"

          echo "OPL_DESKTOP_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          echo "OPL_DESKTOP_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Start base Linux app and read exact version
        if: matrix.distribution == 'linux'
        run: OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Update Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out-target/*.deb)
          test "${#debs[@]}" -eq 1
          sudo apt-get install --no-install-recommends --yes "$(realpath "${debs[0]}")"
          test "$(dpkg-query -W -f='${Version}' "$OPL_DESKTOP_DEB_PACKAGE")" = "$OPL_DESKTOP_TARGET_VERSION"
          test "$(tr -d '\r\n' < "$OPL_DESKTOP_STATE_MARKER")" = "preserve-$GITHUB_SHA"

      - name: Start updated Linux app and read exact version
        if: matrix.distribution == 'linux'
        run: OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_TARGET_VERSION" xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Roll back Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out/*.deb)
          test "${#debs[@]}" -eq 1
          sudo apt-get install --no-install-recommends --yes --allow-downgrades "$(realpath "${debs[0]}")"
          test "$(dpkg-query -W -f='${Version}' "$OPL_DESKTOP_DEB_PACKAGE")" = "$OPL_DESKTOP_BASE_VERSION"
          test "$(tr -d '\r\n' < "$OPL_DESKTOP_STATE_MARKER")" = "preserve-$GITHUB_SHA"

      - name: Start rolled-back Linux app and read exact version
        if: matrix.distribution == 'linux'
        run: OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Purge Linux DEB package and verify cleanup
        if: ${{ always() && matrix.distribution == 'linux' }}
        shell: bash
        run: |
          package_name="${OPL_DESKTOP_DEB_PACKAGE:-}"
          if test -z "$package_name"; then
            shopt -s nullglob
            debs=(out/*.deb)
            if test "${#debs[@]}" -eq 1; then
              package_name="$(dpkg-deb -f "${debs[0]}" Package)"
            fi
          fi

          if test -n "$package_name" && dpkg-query -W "$package_name" >/dev/null 2>&1; then
            sudo dpkg --purge "$package_name"
          fi

          if test -n "${OPL_DESKTOP_EXECUTABLE:-}"; then
            test ! -e "$OPL_DESKTOP_EXECUTABLE"
          fi
          if test -n "${OPL_DESKTOP_APP_PATH:-}"; then
            test ! -e "$OPL_DESKTOP_APP_PATH"
          fi
          if command -v one-person-lab-preview >/dev/null 2>&1; then
            echo "Linux purge left one-person-lab-preview on PATH" >&2
            exit 1
          fi
          status="$(dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null || true)"
          test "$status" != "install ok installed"

      - name: Remove lifecycle smoke state
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const root = process.env.OPL_DESKTOP_SMOKE_STATE_ROOT;
          if (!root) process.exit(0);
          const relative = path.relative(fs.realpathSync.native(os.tmpdir()), fs.realpathSync.native(root));
          if (!relative || relative === ".." || relative.startsWith(`..${path.sep}`) || path.isAbsolute(relative)) {
            throw new Error(`refusing to remove lifecycle state outside the system temp directory: ${root}`);
          }
          fs.rmSync(root, { recursive: true, force: true });
          NODE

  oci-distribution:
    name: OCI multi-architecture build and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install dependencies
        run: npm ci

      - name: Run OCI source gates
        run: npm run test:oci

      - name: Build non-public multi-architecture OCI layout
        shell: bash
        run: |
          cohort_json="$(node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("src/candidateContractEvidence.json","utf8"));process.stdout.write(JSON.stringify(e.candidate_runtime_qualification?.external_cohort??{}))')"
          framework_ref="$(jq -er '.framework_commit | select(test("^[0-9a-f]{40}$"))' <<<"$cohort_json")"
          app_ref="$(jq -er '.app_commit | select(test("^[0-9a-f]{40}$"))' <<<"$cohort_json")"
          archive="$RUNNER_TEMP/one-person-lab-${GITHUB_SHA}.oci.tar"
          plan="$RUNNER_TEMP/one-person-lab-oci-build-plan.json"

          npm run --silent plan:oci:multiarch -- \
            --image "opl-studio:non-release-${GITHUB_SHA}" \
            --source-revision "$GITHUB_SHA" \
            --framework-ref "$framework_ref" \
            --app-ref "$app_ref" \
            --output "$archive" > "$plan"

          test "$(jq -r '.evidenceBoundary.publishesImage' "$plan")" = false
          jq -e '.command | index("--push") == null and all(.[]; contains("type=registry") | not)' "$plan"
          node -e 'const fs=require("fs"),{spawnSync}=require("child_process");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const r=spawnSync(p.command[0],p.command.slice(1),{stdio:"inherit"});process.exit(r.status??1)' "$plan"
          test -s "$archive"
          image_index_digest="$(tar -xOf "$archive" index.json | jq -er '
            [.manifests[] | select(.mediaType == "application/vnd.oci.image.index.v1+json")]
              | if length == 1 then .[0].digest else error("expected exactly one image index") end
          ')"
          image_index_path="blobs/sha256/${image_index_digest#sha256:}"
          tar -xOf "$archive" "$image_index_path" | jq -e '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture]
              | sort | unique) == ["amd64", "arm64"] and
            ([.manifests[] | select(
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] == "attestation-manifest"
              )] | length) == 2
          '

      - name: Prove hosted linux/amd64 OCI lifecycle
        env:
          OPL_OCI_LIFECYCLE_PLATFORM: linux/amd64
        run: npm run smoke:docker:lifecycle

      - name: Prove hosted linux/arm64 OCI lifecycle
        env:
          OPL_OCI_LIFECYCLE_PLATFORM: linux/arm64
        run: npm run smoke:docker:lifecycle
