name: OPL Studio Source Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-studio-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source, contract, and unit validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Run source-only validation
        run: npm run test:source
