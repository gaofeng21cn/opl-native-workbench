appId: cn.gflab.opl.studio.preview
productName: One Person Lab Preview
asar: true
npmRebuild: false
directories:
  output: out
files:
  - desktop/**/*
  - dist/desktop/**/*
  - scripts/webui-host/**/*
  - package.json
mac:
  icon: assets/branding/opl-studio.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip
dmg:
  format: ULFO
win:
  icon: assets/branding/opl-studio.png
  target:
    - nsis
    - zip
nsis:
  guid: a1f6388a-3f9a-5543-b06c-e3debfa55a91
linux:
  icon: assets/branding/opl-studio.png
  category: Development
  maintainer: Feng Gao <gaofeng21cn@hotmail.com>
  executableName: one-person-lab-preview
  target:
    - AppImage
    - deb
appImage:
  executableArgs:
    - --enable-sandbox
    - --disable-setuid-sandbox
deb:
  afterRemove: scripts/desktop/linux-after-remove.sh
artifactName: one-person-lab-preview-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: gaofeng21cn
  repo: opl-studio
