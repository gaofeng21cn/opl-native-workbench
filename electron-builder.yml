appId: cn.gflab.opl.studio.preview
productName: One Person Lab Preview
asar: true
npmRebuild: false
directories:
  output: out
files:
  - desktop/**/*
  - dist/desktop/**/*
  - scripts/webui-host/**/*
  - package.json
mac:
  icon: assets/branding/opl-studio.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip
dmg:
  format: ULFO
win:
  icon: assets/branding/opl-studio.png
  target:
    - nsis
    - zip
linux:
  icon: assets/branding/opl-studio.png
  category: Development
  maintainer: Feng Gao <gaofeng21cn@hotmail.com>
  target:
    - AppImage
    - deb
artifactName: one-person-lab-preview-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: gaofeng21cn
  repo: opl-studio
