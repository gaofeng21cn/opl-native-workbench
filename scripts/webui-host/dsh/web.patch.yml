- insert:
    - id: frontend-static
      name: '@deepseek-ai/dsh-host-frontend-static'
      config:
        distIndex: !!js "process.getBuiltinModule('node:path').join(ctx.oplStudioHostOptions.webRoot, 'index.html')"

    - id: client-modules
      name: '@deepseek-ai/dsh-client-modules'

    - id: opl-studio-client
      name: '@one-person-lab/opl-studio-client'

    - id: opl-web-routes
      name: ./plugins/opl-web-routes.mjs
