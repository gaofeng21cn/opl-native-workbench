- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js ctx.oplStudioHostOptions.webHost ?? '127.0.0.1'
    port: !!js ctx.oplStudioHostOptions.webPort ?? 0

- id: opl-dsh-tool-mcp
  name: ./plugins/opl-dsh-tool-mcp.mjs

- id: opl-codex-native
  name: ./plugins/opl-codex-native.mjs

- id: opl-framework-bridge
  name: ./plugins/opl-framework-bridge.mjs

- id: opl-host-core
  name: ./plugins/opl-host-core.mjs

- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'
